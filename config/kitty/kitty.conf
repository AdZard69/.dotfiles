include ~/.config/kitty/font.conf

window_padding_width 12

cursor_shape beam
cursor_blink_interval 0.5

enable_audio_bell no

confirm_os_window_close 0

# --- background opacity -------------------------------------------------
# Default is fully opaque so long-form reading (glow, nvim) stays legible.
# NOTE: changing dynamic_background_opacity requires a FULL RESTART of
# kitty. A config reload (ctrl+shift+f5) will NOT pick it up.
background_opacity 1.0
dynamic_background_opacity yes

# explicit toggles - one keypress each, both directions
map ctrl+shift+f1 set_background_opacity 1.0
map ctrl+shift+f2 set_background_opacity 0.8

# kitty's built-in stepping (kitty_mod = ctrl+shift):
#   ctrl+shift+a > m   more opaque  (+0.1)
#   ctrl+shift+a > l   less opaque  (-0.1)
#   ctrl+shift+a > 1   fully opaque
#   ctrl+shift+a > d   reset to the value above (1.0, so it looks like a no-op)
# ------------------------------------------------------------------------

term xterm-256color
hide_window_decorations yes
scrollback_lines 10000

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

shell_integration enabled


# BEGIN_KITTY_THEME
# Gruvbox Material Dark Hard
include current-theme.conf
# END_KITTY_THEME
