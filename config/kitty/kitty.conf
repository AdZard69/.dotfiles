# Kitty — Gruvbox Material daily driver
# Font family and size are managed separately so your `kf` font switcher works.
include ~/.config/kitty/font.conf

# --- Theme ---------------------------------------------------------------
# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME

# Keep the terminal spacious, but not wasteful on a laptop display.
window_padding_width 15
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 1
enable_audio_bell no
term xterm-256color
scrollback_lines 10000
shell_integration enabled

# --- Cursor and selection ------------------------------------------------
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.8 ease-in-out
cursor_stop_blinking_after 12.0
# cursor #d8a657
# cursor_text_color #1d2021

# Brief, warm cursor motion for visible jumps without distracting trails while
# typing. Requires Kitty 0.37 or newer.
cursor_trail 100
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 2
# cursor_trail_color #d8a657

# Kept after the theme include deliberately: these values must win.
# selection_background #d8a657
# selection_foreground #1d2021

# --- Transparency --------------------------------------------------------
# Opaque by default keeps nvim, long reading, and screenshots crisp.
# Dynamic opacity costs a little rendering performance, but enables the keys
# below. Restart Kitty once after changing this setting.
background_opacity 1.0
dynamic_background_opacity yes
map ctrl+shift+f1 set_background_opacity 1.0
map ctrl+shift+f2 set_background_opacity 0.90
map ctrl+shift+1  set_background_opacity 1.0
map ctrl+shift+2  set_background_opacity 0.90

# Built in incremental controls: Ctrl+Shift+A, then M/L/1/D.

# --- Tab bar -------------------------------------------------------------

# Override theme-generated tab colours with a single Gruvbox Material system.
# tab_bar_background #1d2021
# active_tab_foreground #1d2021
# active_tab_background #d8a657
active_tab_font_style bold
# inactive_tab_foreground #a89984
# inactive_tab_background #282828
inactive_tab_font_style normal

# --- Productive window control ------------------------------------------
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f next_layout
map ctrl+shift+g kitten hints --type=linenum --linenum-action=tab nvim +{line} {path}
map ctrl+shift+u kitten unicode_input
map ctrl+shift+comma edit_config_file
map ctrl+shift+space kitty_shell window

# Reload visual settings after edits (opacity mode itself needs a restart).
map ctrl+shift+f5 load_config_file

# vim:ft=kitty


# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS