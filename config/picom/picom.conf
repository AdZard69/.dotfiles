#########################################
# Picom Configuration – Rounded + Blur  #
#########################################

# --- Corners ---
corner-radius = 16;
rounded-corners-exclude = [
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Opacity rules ---
opacity-rule = [
  "90:class_g = 'code-oss'",         # VS Code
  "93:class_g = 'google-chrome'",    # Chrome/Brave
  "95:class_g = 'gnome-terminal'",   # Terminal
  "100:class_g = 'Nemo'"             # File manager
];

# --- Shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.25;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'menu'",
  "window_type = 'tooltip'"
];

# --- Fade animation ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Transparency / Blur ---
backend = "glx";
vsync = true;

blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Performance ---
use-damage = true;
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-client-leader = true;

